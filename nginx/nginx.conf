events {}

http {
    client_max_body_size 2000M;

    # Generous timeouts everywhere: large/slow video uploads (through the API vhost) and large/slow video
    # downloads (through the MinIO vhost, presigned GETs) both need to survive minutes-long transfers on
    # ordinary connections. Matches gunicorn's own --timeout 1000.
    proxy_read_timeout 1000s;
    proxy_send_timeout 1000s;

    # Bare IP (or any Host header that doesn't match api.fitboook.ir below) — unchanged, still fronts MinIO's
    # public buckets (cover images, app releases, presigned video/PDF downloads). Listed first so it's nginx's
    # default server for port 80.
    server {
        listen 80 default_server;

        location / {
            proxy_pass http://minio:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # api.fitboook.ir on :80 — only serves the Let's Encrypt ACME challenge; everything else redirects to https.
    server {
        listen 80;
        server_name api.fitboook.ir;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # api.fitboook.ir on :443 — API + MinIO's public buckets + the PWA web app, same domain/port/cert.
    # Routed by path prefix: known bucket names go straight to MinIO with the path untouched (so presigned
    # SigV4 signatures — which cover the exact request path — still validate; no rewriting involved), then
    # /api, /django-admin and /static go to Django, and every other path is the PWA web app.
    server {
        listen 443 ssl;
        server_name api.fitboook.ir;

        ssl_certificate     /etc/letsencrypt/live/api.fitboook.ir/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.fitboook.ir/privkey.pem;

        location ~ ^/(encrypted-videos|course-covers|course-pdfs|app-releases)(/|$) {
            proxy_pass http://minio:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Django: the API, its admin site, and its static files (admin css/js via WhiteNoise).
        location ~ ^/(api|django-admin|static)(/|$) {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Everything else: the PWA web app (web/ in the repo, installed with scripts/install-web.sh).
        # Cache rules from the build's README-DEPLOY: entry files must revalidate, hashed bundles are immutable.
        root /usr/share/nginx/fitboook-web;

        location = /service-worker.js    { add_header Cache-Control "no-cache"; }
        location = /index.html           { add_header Cache-Control "no-cache"; }
        location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
        location /_expo/static/          { add_header Cache-Control "public, max-age=31536000, immutable"; }
        location / {
            # Client-side routes (/courses, /admin/users, ...) all load index.html.
            try_files $uri $uri/ /index.html;
        }
    }
}
