events {}

http {
    client_max_body_size 2000M;

    # Generous timeouts everywhere: large/slow video uploads (through the API vhost) and large/slow video
    # downloads (through the MinIO vhost, presigned GETs) both need to survive minutes-long transfers on
    # ordinary connections. Matches gunicorn's own --timeout 1000.
    proxy_read_timeout 1000s;
    proxy_send_timeout 1000s;

    # Bare IP (or any Host header that doesn't match api.fitboook.ir below) — unchanged, still fronts MinIO's
    # public buckets (cover images, app releases, presigned video/PDF downloads). Listed first so it's nginx's
    # default server for port 80.
    server {
        listen 80 default_server;

        location / {
            proxy_pass http://minio:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # api.fitboook.ir on :80 — only serves the Let's Encrypt ACME challenge; everything else redirects to https.
    server {
        listen 80;
        server_name api.fitboook.ir;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # api.fitboook.ir on :443 — API + MinIO's public buckets, same domain/port/cert, no port juggling.
    # Routed by path prefix: known bucket names go straight to MinIO with the path untouched (so presigned
    # SigV4 signatures — which cover the exact request path — still validate; no rewriting involved), anything
    # else goes to Django.
    server {
        listen 443 ssl;
        server_name api.fitboook.ir;

        ssl_certificate     /etc/letsencrypt/live/api.fitboook.ir/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.fitboook.ir/privkey.pem;

        location ~ ^/(encrypted-videos|course-covers|course-pdfs|app-releases)(/|$) {
            proxy_pass http://minio:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
